server:
  port: 8080

spring:
  application:
    name: Muti-Threaded-Spring-Crud-App

  # ===================================================================
  # 2. POSTGRESQL CONFIGURATION (Relational DB - Profiles)
  # ===================================================================
  datasource:
    url: jdbc:postgresql://localhost:5432/user_dashboard_db
    username: postgres
    password: 2810
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===================================================================
  # 3. MONGODB CONFIGURATION (NoSQL DB - Activity Logs)
  # ===================================================================
  data:
    mongodb:
      uri: mongodb://localhost:27017/user_activities_db
      database: user_activities